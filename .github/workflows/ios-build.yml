name: iOS Build

concurrency:
  group: shayan-core-ios-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          xcode-select -p

      - name: Validate project structure
        run: |
          test -d ShayanCommandCenter.xcodeproj
          test -f ShayanCommandCenter.xcodeproj/project.pbxproj
          test -f ShayanCommandCenter/Info.plist
          test -f ShayanCommandCenter/ShayanCommandCenterApp.swift
          test -f ShayanCommandCenter/HomeView.swift
          test -f ShayanCommandCenter/DashboardStatus.swift
          test -f ShayanCommandCenter/CoreNavigation.swift
          test -f ShayanCommandCenter/Reminders.swift
          test -f ShayanCommandCenter/CoreCommandView.swift
          test -f ShayanCommandCenterWidget/ShayanCoreWidget.swift
          test -f ShayanCommandCenterWidget/ShayanCoreWidgetBundle.swift
          test -f Configuration/Debug.xcconfig
          test -f Configuration/Release.xcconfig
          test -f ShayanCommandCenter.xcodeproj/xcshareddata/xcschemes/ShayanCommandCenter.xcscheme

      - name: List Xcode project
        run: |
          xcodebuild -list -project ShayanCommandCenter.xcodeproj

      - name: Show effective Release settings
        run: |
          xcodebuild             -project ShayanCommandCenter.xcodeproj             -scheme ShayanCommandCenter             -configuration Release             -sdk iphonesimulator             -showBuildSettings             | tee build-settings.txt
          grep -E '^( *PRODUCT_BUNDLE_IDENTIFIER| *INFOPLIST_FILE| *GENERATE_INFOPLIST_FILE| *SWIFT_VERSION| *IPHONEOS_DEPLOYMENT_TARGET| *TARGETED_DEVICE_FAMILY| *CONFIGURATION_BUILD_DIR) =' build-settings.txt

      - name: Build Command Centre
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild             -project ShayanCommandCenter.xcodeproj             -scheme ShayanCommandCenter             -configuration Release             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             clean build

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphonesimulator/ShayanCommandCenter.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          file "$APP/ShayanCommandCenter"

      - name: Package simulator app
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent             build/DerivedData/Build/Products/Release-iphonesimulator/ShayanCommandCenter.app             artifacts/ShayanCommandCenter-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: shayan-command-centre-simulator
          path: artifacts/ShayanCommandCenter-Simulator.zip


      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          rm -rf build/DeviceDerivedData
          xcodebuild \
            -project ShayanCommandCenter.xcodeproj \
            -scheme ShayanCommandCenter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify device app bundle
        run: |
          set -euo pipefail
          APP="build/DeviceDerivedData/Build/Products/Release-iphoneos/ShayanCommandCenter.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          file "$APP/ShayanCommandCenter"

      - name: Package unsigned iPhone IPA
        run: |
          set -euo pipefail
          APP="build/DeviceDerivedData/Build/Products/Release-iphoneos/ShayanCommandCenter.app"
          rm -rf ipa
          mkdir -p ipa/Payload artifacts
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry "../artifacts/ShayanCommandCenter-Unsigned.ipa" Payload

      - name: Sanity check unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="build/IPA/ShayanCommandCenter-Unsigned.ipa"
          test -f "$IPA_PATH"
          rm -rf build/ipa-sanity
          mkdir -p build/ipa-sanity
          unzip -q "$IPA_PATH" -d build/ipa-sanity
          APP_PATH="build/ipa-sanity/Payload/ShayanCommandCenter.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          if [ -d "$APP_PATH/PlugIns/ShayanCoreWidget.appex" ]; then
            WIDGET_PATH="$APP_PATH/PlugIns/ShayanCoreWidget.appex"
            test -f "$WIDGET_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET_PATH/Info.plist" | grep -q "com.apple.widgetkit-extension"
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPrincipalClass" "$WIDGET_PATH/Info.plist"
          fi

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: shayan-command-centre-unsigned-ipa
          path: artifacts/ShayanCommandCenter-Unsigned.ipa
