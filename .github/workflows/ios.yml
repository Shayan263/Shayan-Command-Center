name: iOS Build

on:
  push:
    branches: ["ios-app", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Shayan Command Centre
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/ShayanCommandCentre.xcodeproj \
            -scheme ShayanCommandCentre \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build completed
        run: echo "Shayan Command Centre iOS build completed."
